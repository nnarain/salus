services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
    networks:
      - default
      - database
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/profile').then(response => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  mcp:
    profiles: ["mcp"]
    build:
      context: ./mcp
    restart: unless-stopped
    init: true
    ports:
      - "${MCP_BIND_ADDRESS:-127.0.0.1}:${MCP_PORT:-8000}:8000"
    environment:
      HEALTH_TRACKER_API_URL: http://app:3000
      TZ: ${TZ:-UTC}
    depends_on:
      app:
        condition: service_healthy

  sleep-webhook:
    profiles: ["sleep-webhook"]
    build:
      context: ./sleep-webhook
    restart: unless-stopped
    init: true
    ports:
      - "${SLEEP_WEBHOOK_BIND_ADDRESS:-127.0.0.1}:${SLEEP_WEBHOOK_PORT:-8001}:8000"
    environment:
      HEALTH_TRACKER_API_URL: http://app:3000
      TZ: ${TZ:-UTC}
      WEBHOOK_TOKEN: ${SLEEP_WEBHOOK_TOKEN:-}
      MIN_SLEEP_MINUTES: ${SLEEP_WEBHOOK_MIN_MINUTES:-120}
    volumes:
      - sleep-webhook-data:/data
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres-data:
  sleep-webhook-data:

networks:
  default:
  database:
    internal: true
