version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: health-tracker-db
    environment:
      POSTGRES_DB: health_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - health-tracker-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: health-tracker-backend
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: health_tracker
      DB_USER: postgres
      DB_PASSWORD: postgres
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      MEALIE_BASE_URL: ${MEALIE_BASE_URL:-http://mealie:9000}
      MEALIE_API_TOKEN: ${MEALIE_API_TOKEN}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - health-tracker-network
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: health-tracker-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - health-tracker-network

  # Optional: Mealie for recipe management
  # Uncomment the following section to include Mealie
  # mealie:
  #   image: ghcr.io/mealie-recipes/mealie:latest
  #   container_name: mealie
  #   environment:
  #     PUID: 1000
  #     PGID: 1000
  #     TZ: America/New_York
  #     BASE_URL: http://localhost:9000
  #   volumes:
  #     - mealie_data:/app/data
  #   ports:
  #     - "9000:9000"
  #   networks:
  #     - health-tracker-network

networks:
  health-tracker-network:
    driver: bridge

volumes:
  postgres_data:
  # mealie_data:
