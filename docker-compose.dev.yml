services:
  db:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - default
      - database

  app:
    build:
      target: deps
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - dev-node-modules:/app/node_modules
      - dev-next:/app/.next
    command: ["sh", "-c", "npm ci --no-audit --no-fund && exec npm run dev"]

volumes:
  dev-node-modules:
  dev-next:
